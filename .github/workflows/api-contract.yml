name: Core workflows and API contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-contract.yml
      - app/src/**
      - app/scripts/check-integrated-studio.mjs
      - app/scripts/build-framework-preview.mjs
      - app/scripts/esbuild-with-signal.mjs
      - app/test/esbuild-with-signal.test.mjs
      - app/test/framework-preview-packages.test.mjs
      - app/scripts/integrated-studio-*.mjs
      - scripts/run-integrated-*-local.py
      - scripts/test_integrated_local.py
      - scripts/local-publication-bridge.py
      - scripts/local_framework_publication.py
      - scripts/test_local_framework_publication.py
      - services/observable-preview/**
      - services/observable-coordinator/src/local-adapters.mjs
      - services/observable-coordinator/test/local-adapters.test.mjs
      - app/vendor/**
      - app/package.json
      - app/package-lock.json
      - app/test/catalog-project-save.test.mjs
      - app/test/cog-preview.test.mjs
      - app/test/project-directory-ux.test.mjs
      - app/test/project-resource-creation.test.mjs
      - app/test/map-resource-version.test.mjs
      - app/test/project-dataset-map-handoff.test.mjs
      - app/test/geomoose-query-ui.test.mjs
      - app/test/publication-panels.test.mjs
      - app/test/framework-project-preview.test.mjs
      - app/test/framework-build-history.test.mjs
      - app/test/publication-preview-origins.test.mjs
      - schemas/**
      - services/api/src/**
      - services/api/tests/**
      - services/api/scripts/export_openapi.py
      - services/api/scripts/export_stac_ckan.py
      - services/api/pyproject.toml
      - services/api/requirements*.in
      - services/api/requirements*.lock
      - docs/api/openapi.json
      - docs/api/examples.json
      - docs/api/fixtures/**
      - docs/api/evidence/stac-ckan-export.json
      - parity/fixtures/data/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/api-contract.yml
      - app/src/**
      - app/scripts/check-integrated-studio.mjs
      - app/scripts/build-framework-preview.mjs
      - app/scripts/esbuild-with-signal.mjs
      - app/test/esbuild-with-signal.test.mjs
      - app/test/framework-preview-packages.test.mjs
      - app/scripts/integrated-studio-*.mjs
      - scripts/run-integrated-*-local.py
      - scripts/test_integrated_local.py
      - scripts/local-publication-bridge.py
      - scripts/local_framework_publication.py
      - scripts/test_local_framework_publication.py
      - services/observable-preview/**
      - services/observable-coordinator/src/local-adapters.mjs
      - services/observable-coordinator/test/local-adapters.test.mjs
      - app/vendor/**
      - app/package.json
      - app/package-lock.json
      - app/test/catalog-project-save.test.mjs
      - app/test/cog-preview.test.mjs
      - app/test/project-directory-ux.test.mjs
      - app/test/project-resource-creation.test.mjs
      - app/test/map-resource-version.test.mjs
      - app/test/project-dataset-map-handoff.test.mjs
      - app/test/geomoose-query-ui.test.mjs
      - app/test/publication-panels.test.mjs
      - app/test/framework-project-preview.test.mjs
      - app/test/framework-build-history.test.mjs
      - app/test/publication-preview-origins.test.mjs
      - schemas/**
      - services/api/src/**
      - services/api/tests/**
      - services/api/scripts/export_openapi.py
      - services/api/scripts/export_stac_ckan.py
      - services/api/pyproject.toml
      - services/api/requirements*.in
      - services/api/requirements*.lock
      - docs/api/openapi.json
      - docs/api/examples.json
      - docs/api/fixtures/**
      - docs/api/evidence/stac-ckan-export.json
      - parity/fixtures/data/**
  workflow_dispatch:
    inputs:
      fresh_installation:
        description: Build public source images and run the connected local installation checks
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation && '-fresh-installation' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.fresh_installation) }}

jobs:
  frontend-core:
    name: Catalog, map and publication workflows (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation && 28 || 8 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare an empty local installation store
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          command -v podman
          command -v setfacl
          test -x /usr/bin/chromium || test -x /usr/bin/chromium-browser || test -x /usr/bin/google-chrome
          fresh="$(realpath -- "$RUNNER_TEMP")/opengeo-source-install"
          test ! -e "$fresh"
          install -d -m 0700 "$fresh" "$fresh/graph" "$fresh/run" "$fresh/tmp" "$fresh/npm"
          printf '[storage]\ndriver = "overlay"\nrunroot = "%s/run"\ngraphroot = "%s/graph"\nrootless_storage_path = "%s/graph"\n[storage.options]\nadditionalimagestores = []\n' "$fresh" "$fresh" "$fresh" > "$fresh/storage.conf"
          printf '{"auths":{}}\n' > "$fresh/anonymous-auth.json"
          chmod 0600 "$fresh/storage.conf" "$fresh/anonymous-auth.json"
          CONTAINERS_STORAGE_CONF="$fresh/storage.conf" podman info --format json > "$fresh/podman-before.json"
          FRESH_STORE="$fresh" python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          fresh = Path(os.environ['FRESH_STORE'])
          info = json.loads((fresh / 'podman-before.json').read_text())
          space = os.statvfs(fresh)
          print(json.dumps({'podmanVersion': info['version']['Version'], 'configFile': info['store']['configFile'], 'graphRoot': info['store']['graphRoot'], 'runRoot': info['store']['runRoot'], 'expectedGraphRoot': str(fresh / 'graph'), 'expectedRunRoot': str(fresh / 'run'), 'initialImages': info['store']['imageStore']['number'], 'availableBytes': space.f_bavail * space.f_frsize}))
          assert info['host']['security']['rootless'] is True, 'Podman must run rootless'
          assert info['host']['cgroupVersion'] == 'v2', 'Podman requires cgroup v2'
          assert info['store']['graphRoot'] == str(fresh / 'graph'), f"Unexpected image store: {info['store']['graphRoot']} != {fresh / 'graph'}"
          assert info['store']['imageStore']['number'] == 0, 'Fresh image store must be empty'
          assert space.f_bavail * space.f_frsize >= 12 * 1024**3, 'Fresh installation needs 12 GiB free before image downloads'
          PYTHON
          printf 'OPEN_GEO_FRESH_STORE=%s\nCONTAINERS_STORAGE_CONF=%s/storage.conf\nNPM_CONFIG_CACHE=%s/npm\n' "$fresh" "$fresh" "$fresh" >> "$GITHUB_ENV"
      - name: Restore npm downloads without saving a new cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.fresh_installation) }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('app/package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - name: Install locked frontend dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.fresh_installation) }}
        run: npm --prefix app ci --ignore-scripts --no-audit --no-fund
      - name: Install locked frontend dependencies with native install scripts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation }}
        run: npm --prefix app ci --no-audit --no-fund
      - name: Set up Python for local runner checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check local runner boundaries without starting containers
        run: python -I -S scripts/test_integrated_local.py
      - name: Check Catalog save, map reopen, query authority and publication drafts
        run: |
          set -euo pipefail
          # Each JSDOM suite owns its globals and lifecycle hooks.
          for test_file in \
            app/test/catalog-project-save.test.mjs \
            app/test/cog-preview.test.mjs \
            app/test/project-directory-ux.test.mjs \
            app/test/project-resource-creation.test.mjs \
            app/test/map-resource-version.test.mjs \
            app/test/project-dataset-map-handoff.test.mjs \
            app/test/geomoose-query-ui.test.mjs \
            app/test/publication-panels.test.mjs \
            app/test/framework-project-preview.test.mjs \
            app/test/framework-build-history.test.mjs \
            app/test/publication-preview-origins.test.mjs \
            app/test/esbuild-with-signal.test.mjs \
            services/observable-preview/test/local-server.test.mjs \
            services/observable-coordinator/test/local-adapters.test.mjs; do
            node --test --test-isolation=none "$test_file"
          done
      - name: Build the documented public source images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation }}
        env:
          TMPDIR: ${{ runner.temp }}/opengeo-source-install/tmp
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m bash -euo pipefail <<'BUILD'
          pull_options=(--authfile "$OPEN_GEO_FRESH_STORE/anonymous-auth.json")
          pull_help="$(podman pull --help)"
          if [[ "$pull_help" =~ (^|[[:space:]])--retry([[:space:]=]|$) ]]; then
            pull_options+=(--retry=0)
          else
            printf '%s\n' 'Podman 4 pull may make three internal transient copy retries; the 12-minute stage limit applies, with no outer retry.'
          fi
          podman pull "${pull_options[@]}" docker.io/postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932
          build_options=(--jobs=1 --no-cache --layers=false --pull=missing --retry=0 --cpu-period=100000 --cpu-quota=200000 --memory=8g --memory-swap=8g --authfile "$OPEN_GEO_FRESH_STORE/anonymous-auth.json")
          podman build "${build_options[@]}" --iidfile "$OPEN_GEO_FRESH_STORE/api.iid" --file services/api/Dockerfile services/api
          podman build "${build_options[@]}" --iidfile "$OPEN_GEO_FRESH_STORE/worker.iid" --file services/worker/Dockerfile services/worker
          podman build "${build_options[@]}" --iidfile "$OPEN_GEO_FRESH_STORE/pmtiles.iid" --file services/worker/Dockerfile.pmtiles services/worker
          podman build "${build_options[@]}" --iidfile "$OPEN_GEO_FRESH_STORE/compiler.iid" --file services/observable-builder/Dockerfile services/observable-builder
          BUILD
      - name: Run the canonical built Studio installation check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 6m env TMPDIR=/tmp python scripts/run-integrated-studio-local.py \
            --built-studio \
            --api-image "$(cat "$OPEN_GEO_FRESH_STORE/api.iid")" \
            --worker-image "$(cat "$OPEN_GEO_FRESH_STORE/worker.iid")" \
            --pmtiles-worker-image "$(cat "$OPEN_GEO_FRESH_STORE/pmtiles.iid")"
      - name: Run the canonical native publication installation check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 5m env TMPDIR=/tmp python scripts/run-integrated-studio-local.py \
            --publication-only \
            --publication-compiler-digest "$(cat "$OPEN_GEO_FRESH_STORE/compiler.iid")" \
            --api-image "$(cat "$OPEN_GEO_FRESH_STORE/api.iid")" \
            --worker-image "$(cat "$OPEN_GEO_FRESH_STORE/worker.iid")"
      - name: Clean the isolated installation containers
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.fresh_installation }}
        run: |
          set -euo pipefail
          expected="$(realpath -- "$RUNNER_TEMP")/opengeo-source-install"
          if test "${CONTAINERS_STORAGE_CONF:-}" != "$expected/storage.conf"; then
            exit 0
          fi
          test "$(podman info --format '{{.Store.GraphRoot}}')" = "$expected/graph"
          podman rm --all --force --volumes
          podman ps --all --external --format json > "$expected/containers-after.json"
          python - "$expected/containers-after.json" <<'PYTHON'
          import json, sys
          from pathlib import Path
          assert json.loads(Path(sys.argv[1]).read_text()) == [], 'Isolated containers remain'
          PYTHON
  api-contract:
    name: API contract and metadata (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_installation && 10 || 15 }}
    defaults:
      run:
        working-directory: services/api
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore pip downloads without saving a new cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: setup-python-${{ runner.os }}-x64-24.04-Ubuntu-python-${{ steps.python.outputs.python-version }}-pip-${{ hashFiles('services/api/requirements.lock', 'services/api/requirements-dev.lock') }}
          restore-keys: setup-python-${{ runner.os }}-x64-24.04-Ubuntu-python-${{ steps.python.outputs.python-version }}-pip-
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Record runtime dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip freeze
      - name: Check saved API contract
        run: python scripts/export_openapi.py --check
      - name: Check local publication storage and activation boundaries
        run: PYTHONPATH=src python ../../scripts/test_local_framework_publication.py
      - name: Check workspace routes and metadata contracts
        run: |
          python -m pytest \
            tests/test_openapi_export.py \
            tests/test_analysis_jobs.py \
            tests/test_processing_dispatch.py \
            tests/test_config.py \
            tests/test_observable_previews.py \
            tests/test_observable_source_routes.py \
            tests/test_workspace_routes.py \
            tests/test_metadata_adapters.py \
            tests/test_metadata_profiles.py \
            tests/test_ckan_export.py \
            tests/test_ckan.py \
            tests/test_ckan_routes.py
