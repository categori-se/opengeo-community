[extend]
useDefault = true

# Reviewed false positives: migration source checksums, an immutable container
# image ID, and one synthetic idempotency UUID. Keep the default rules active.
[[allowlists]]
description = "Migration SQL source checksums in retained schema receipts"
condition = "AND"
paths = ['''(^|/)database/baselines/[0-9]{4}_opengeo_schema\.sql$''']
regexTarget = "line"
regexes = ['''^\s*\('[0-9]{4}_[a-z0-9_]+\.sql', '[a-f0-9]{64}'\),?\s*$''']

[[allowlists]]
description = "Exact retained API container image ID, not an API credential"
condition = "AND"
paths = ['''(^|/)scripts/run-integrated-pilot-local\.py$''']
regexTarget = "line"
regexes = ['''^API_IMAGE = "e96f54edd237af0bb75f1803c9e444daa12b5f600dfe7229f0c79d398c52b5cb"$''']

[[allowlists]]
description = "Exact synthetic preview idempotency UUID in API client test"
condition = "AND"
paths = ['''(^|/)app/test/api-client\.test\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*\{purpose: "preview", idempotencyKey: "259e3486-e51b-4751-bc6b-d9e1859f55a6"\}\s*$''']

[[allowlists]]
description = "Exact synthetic Secrets Manager resource ARN in the bootstrap test; identifier, not a secret value"
condition = "AND"
paths = ['''(^|/)database/test/test_bootstrap_github_build_connection\.py$''']
regexTarget = "line"
regexes = ['''^\s*"coordinatorDatabaseSecretArn": f"arn:aws:secretsmanager:us\-east\-1:\{ACCOUNT\}:secret:coordinator\-AbCd12",\s*$''']

[[allowlists]]
description = "Exact nonfunctional header-only and malformed key fixtures rejected before crypto or cloud"
condition = "AND"
paths = ['''(^|/)scripts/test_community_aws\.py$''']
regexTarget = "line"
regexes = ['''^\s*for body in \('\-\-\-\-\-BEGIN PRIVATE KEY\-\-\-\-\-\\n', PUBLIC_KEY \+ "\-\-\-\-\-BEGIN PRIVATE KEY\-\-\-\-\-\\nprivate\\n", "\-\-\-\-\-BEGIN PUBLIC KEY\-\-\-\-\-\\n" \+ "a" \* 8192\):\s*$''']
