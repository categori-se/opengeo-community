<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framework draft preview</title>
<style>html,body{height:100%;margin:0}iframe{display:block;width:100%;height:100%;border:0}</style>
<iframe title="Rendered Framework draft" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script>
// Deliberately no fetch, storage, credentials, capability exchange or URL data.
// This bootstrap has a dedicated response CSP; signed-in Studio stays unchanged.
(() => {
  let connected = false;
  window.addEventListener('message', event => {
    if (connected || event.source !== parent
      || !['https://studio.opengeo.tools', 'https://demo.studio.opengeo.tools'].includes(event.origin)
      || event.data !== 'opengeo-framework-draft-connect' || event.ports.length !== 1) return;
    connected = true;
    const port = event.ports[0], frame = document.querySelector('iframe');
    let accepted = false;
    port.onmessage = ({data}) => {
      if (accepted) return;
      const files = data?.attachments ?? [];
      if (data?.kind !== 'render' || data.revision !== 1 || typeof data.html !== 'string'
        || new TextEncoder().encode(data.html).byteLength > 32 * 1024 * 1024
        || !Array.isArray(files) || files.length > 128
        || files.some((file, index) => file.path !== `/attachment/${index}` || !(file.blob instanceof Blob) || file.blob.size < 1)
        || files.reduce((size, file) => size + file.blob.size, 0) > 64 * 1024 * 1024) {
        port.postMessage({kind:'error'}); port.close(); return;
      }
      accepted = true;
      if (files.length) {
        const sendFiles = event => {
          if (event.source !== frame.contentWindow || event.data !== 'opengeo-framework-files-ready') return;
          window.removeEventListener('message', sendFiles);
          frame.contentWindow.postMessage({kind:'opengeo-framework-files', files}, '*');
        };
        window.addEventListener('message', sendFiles);
      }
      frame.addEventListener('load', () => {port.postMessage({kind:'rendered',revision:1}); port.close();}, {once:true});
      frame.srcdoc = data.html;
    };
    port.postMessage('ready');
  });
})();
</script>
</html>
