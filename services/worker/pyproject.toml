[project]
name = "opengeo-worker"
version = "0.1.0"
description = "Isolated idempotent OpenGeo GIS ingestion worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb==1.5.5",
  "geopandas==1.1.4",
  "psycopg[binary]==3.3.4",
  "pyarrow==25.0.0",
  "rasterio==1.5.0",
  "rio-cogeo==7.0.2",
  "shapely==2.1.2"
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unreachable = true
