[project]
name = "opengeo-api"
version = "0.1.0"
description = "Tenant-aware OpenGeo platform API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "arabic-reshaper==3.0.1",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx2==2.12.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.14.0",
  "python-bidi==0.6.11",
  "pygeofilter==0.4.0",
  "uvicorn==0.52.3"
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unreachable = true
